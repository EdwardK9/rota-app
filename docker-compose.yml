services:
  rota-app:
    build: .
    container_name: rota-app
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - /mnt/user/appdata/rota-app/data:/app/data
    environment:
      - TZ=Europe/London
      - DATA_DIR=/app/data
      # - ICAL_TOKEN=your-token-here
      # Offsite GitHub backup — pushes the nightly .db backup to a repo (see README).
      # Easier to configure from Settings > Backup & Restore in the app itself;
      # these env vars are only a fallback for values not set there.
      # - GITHUB_BACKUP_REPO=your-username/rota-backups
      # - GITHUB_BACKUP_TOKEN=ghp_your_token_here
      # - GITHUB_BACKUP_BRANCH=main
      # - GITHUB_BACKUP_PATH=backups

  # Maintainerr — library cleanup tool for Plex / Jellyfin / Emby.
  # Web UI: http://<server>:6246 — connect it to your media server from its Settings page.
  # Image moved from jorenn92/maintainerr to maintainerr/maintainerr; the old path is deprecated.
  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    restart: unless-stopped
    ports:
      - "6246:6246"
    volumes:
      - /mnt/user/appdata/maintainerr:/opt/data
    environment:
      - TZ=Europe/London
